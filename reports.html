<!DOCTYPE html>
<html lang="en">

</head>

      <a href="index.html" class="text-blue-600 hover:underline">← Back to Main Page</a>

    <h3 class="p-4">All research reports (newest first):</h3>
    <div id="reports-container" class="flex flex-row flex-wrap">
    </div>

  <script src="js/reports.js"></script>

</html>
